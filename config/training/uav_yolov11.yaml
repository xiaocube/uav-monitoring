# ============================================================
# SkyGuard YOLOv11 训练配置 - UAV 高空航拍小目标检测
# ============================================================
# 目标平台: Mac M4 (Metal MPS 加速, 16GB 统一内存)
# 数据集: ~8000 张 UAV 航拍图片
# 场景: 远距离无人机小目标检测
# ============================================================

# 模型选择（YOLOv11 系列）
#   yolo11n: 最轻量, 2.6M 参数, 适合快速验证
#   yolo11s: 推荐, 9.5M 参数, 精度/速度平衡
#   yolo11m: 20.1M 参数, 更高精度, 训练更慢
model: "yolo11s.pt"

# 数据集配置
data: "data/skyguard-v2/dataset.yaml"

# 训练输出
project: "models/trained"
name: "skyguard-v2-uav"
exist_ok: false

# ============================================================
# 图像参数
# ============================================================
# 640: M4 16GB 安全分辨率，内存占用约 6-8GB
# 如需更高精度可尝试 1280（需降低 batch 到 4）
imgsz: 640

# ============================================================
# 训练参数
# ============================================================
epochs: 100              # 8000 张数据集, 100 epoch 充分收敛
patience: 20             # 早停: 20 个 epoch 无提升则停止

# M4 MPS 优化参数
# - batch=8: M4 16GB @640 安全值，内存占用约 6-8GB
# - workers=0: Mac 上设为 0 使用主进程加载，避免 dataloader 卡死
batch: 8
workers: 0
device: "mps"            # 强制使用 MPS (Metal Performance Shaders)

# ============================================================
# 优化器
# ============================================================
optimizer: "AdamW"       # AdamW 对小目标检测更稳定
lr0: 0.001               # 初始学习率 (YOLOv11 默认)
lrf: 0.01                # 最终学习率 = lr0 * lrf = 1e-5
momentum: 0.937
weight_decay: 0.0005

# 学习率调度
cos_lr: true             # 余弦退火, 微调更稳定
warmup_epochs: 3         # 预热轮数
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ============================================================
# 数据增强（轻量化策略，避免 M4 内存溢出）
# ============================================================
# 颜色增强
hsv_h: 0.015             # 色调变化（航拍光线变化小，用默认值）
hsv_s: 0.7               # 饱和度变化
hsv_v: 0.4               # 亮度变化

# 几何增强
degrees: 10.0            # 旋转 ±10°（无人机各角度出现）
translate: 0.1           # 平移
scale: 0.5               # 多尺度训练（模拟不同距离，640下适度缩放）
shear: 2.0               # 剪切
perspective: 0.0         # 透视变换（航拍不需要）

# 翻转
flipud: 0.0              # 上下翻转（航拍不需要）
fliplr: 0.5              # 左右翻转

# 小目标专用增强（轻量化）
mosaic: 1.0              # Mosaic 拼接（4图合一，小目标增强核心）
mixup: 0.1               # MixUp 混合
copy_paste: 0.0          # 关闭 Copy-Paste（M4 16GB 下内存占用过高）
close_mosaic: 10         # 最后 10 epoch 关闭 mosaic（提升精度）

# 其他
rect: false              # 矩形训练（小目标场景不需要）
single_cls: false        # 单类别数据集设为 false

# ============================================================
# 验证参数
# ============================================================
val: true
iou: 0.6                 # NMS IoU 阈值
max_det: 300             # 最大检测数

# ============================================================
# 保存与恢复
# ============================================================
save: true
save_period: 10          # 每 10 epoch 保存一次检查点
resume: false            # 是否断点续训
pretrained: true         # 使用预训练权重
seed: 42
deterministic: true      # 确定性训练（保证可复现）

# ============================================================
# AMP 混合精度（MPS 支持）
# ============================================================
# M4 MPS 下 AMP 可能不稳定，遇到 nan loss 请关闭
amp: true

# ============================================================
# 其他
# ============================================================
fraction: 1.0            # 使用全部数据集
dropout: 0.0             # 分类头 dropout
verbose: true
plots: true              # 保存训练曲线